<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#161b2e" />
    </linearGradient>

    <linearGradient id="titleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#4facfe" stop-opacity="0.8" />
    </linearGradient>

    <linearGradient id="accentPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b224ef" stop-opacity="0.7" />
      <stop offset="100%" stop-color="#7579ff" stop-opacity="0.7" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="slightGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#38bdf8" stroke-width="0.7" stroke-opacity="0.1" />
    </pattern>

    <style>
      .bg-rect { fill: url(#bgGrad); }
      .grid-pattern { fill: url(#grid); }
      
      /* Subtle Animated floating elements in background */
      @keyframes floatSlow1 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
        50% { transform: translate(25px, -18px) scale(1.08); opacity: 0.45; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.25; }
      }
      @keyframes floatSlow2 {
        0% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
        50% { transform: translate(-20px, 15px) scale(1.05); opacity: 0.38; }
        100% { transform: translate(0px, 0px) scale(1); opacity: 0.2; }
      }
      @keyframes pulseBeam {
        0% { stroke-dashoffset: 400; opacity: 0.2; }
        50% { opacity: 0.8; }
        100% { stroke-dashoffset: 0; opacity: 0.2; }
      }
      @keyframes blinkCursor {
        0%, 100% { opacity: 1; }
        50% { opacity: 0; }
      }
      @keyframes badgeShimmer {
        0% { opacity: 0.7; }
        50% { opacity: 1; }
        100% { opacity: 0.7; }
      }

      .floating-orb-1 {
        animation: floatSlow1 9s ease-in-out infinite;
      }
      .floating-orb-2 {
        animation: floatSlow2 11s ease-in-out infinite;
      }
      .data-stream {
        stroke-dasharray: 120 280;
        animation: pulseBeam 6s linear infinite;
      }
      .cursor-blink {
        animation: blinkCursor 1.1s infinite;
      }
      .shimmer-badge {
        animation: badgeShimmer 4s ease-in-out infinite;
      }

      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "JetBrains Mono", monospace;
        font-weight: 800;
        font-size: 40px;
        letter-spacing: -0.5px;
        fill: url(#titleGrad);
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        font-weight: 400;
        font-size: 16px;
        fill: #94a3b8;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 12px;
        font-weight: 600;
      }
      .cli-text {
        font-family: "JetBrains Mono", Menlo, Consolas, monospace;
        font-size: 13px;
        fill: #38bdf8;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" class="bg-rect" />
  <rect width="1200" height="360" rx="16" class="grid-pattern" />

  <!-- Dynamic Background Ambient Orbs (strictly background) -->
  <g class="floating-orb-1">
    <circle cx="180" cy="90" r="130" fill="url(#accentCyan)" filter="url(#glow)" />
  </g>
  <g class="floating-orb-2">
    <circle cx="1020" cy="260" r="150" fill="url(#accentPurple)" filter="url(#glow)" />
  </g>

  <!-- Decorative Circuit Data Streams -->
  <path d="M 0 180 Q 300 240 600 180 T 1200 180" fill="none" stroke="#38bdf8" stroke-width="1.8" class="data-stream" opacity="0.4" />
  <path d="M 0 120 Q 350 40 700 120 T 1200 90" fill="none" stroke="#818cf8" stroke-width="1.2" class="data-stream" opacity="0.3" />
  <path d="M 0 270 Q 400 320 800 250 T 1200 290" fill="none" stroke="#c084fc" stroke-width="1.4" class="data-stream" opacity="0.35" />

  <!-- Terminal Window Graphic Header Mockup (Foreground) -->
  <g transform="translate(60, 42)">
    <!-- Terminal Shell Header Container -->
    <rect x="0" y="0" width="1080" height="276" rx="14" fill="#090d16" fill-opacity="0.88" stroke="#1e293b" stroke-width="1.5" />
    
    <!-- Window Controls -->
    <circle cx="28" cy="24" r="6" fill="#ef4444" />
    <circle cx="48" cy="24" r="6" fill="#f59e0b" />
    <circle cx="68" cy="24" r="6" fill="#10b981" />
    <text x="96" y="28" class="cli-text" font-size="12" fill="#64748b">bash ~/awesome-terminal-ide — tmux ⚡ zellij ⚡ live-share</text>

    <!-- Decorative Top Right Badges -->
    <g transform="translate(860, 14)" class="shimmer-badge">
      <rect x="0" y="0" width="105" height="22" rx="11" fill="#1e293b" stroke="#38bdf8" stroke-width="1" />
      <circle cx="12" cy="11" r="4" fill="#38bdf8" />
      <text x="24" y="15" fill="#38bdf8" class="tag-text">CDEs &amp; IDEs</text>
    </g>
    <g transform="translate(975, 14)" class="shimmer-badge">
      <rect x="0" y="0" width="90" height="22" rx="11" fill="#1e293b" stroke="#10b981" stroke-width="1" />
      <circle cx="12" cy="11" r="4" fill="#10b981" />
      <text x="24" y="15" fill="#10b981" class="tag-text">MULTIPLAYER</text>
    </g>

    <line x1="0" y1="44" x2="1080" y2="44" stroke="#1e293b" stroke-width="1" />

    <!-- Terminal Prompt Line -->
    <g transform="translate(32, 80)">
      <text x="0" y="0" class="cli-text" font-weight="700" fill="#10b981">➜</text>
      <text x="20" y="0" class="cli-text" fill="#818cf8">workspace</text>
      <text x="105" y="0" class="cli-text" fill="#64748b">git:(</text>
      <text x="145" y="0" class="cli-text" fill="#ef4444">main</text>
      <text x="180" y="0" class="cli-text" fill="#64748b">)</text>
      <text x="195" y="0" class="cli-text" fill="#e2e8f0">connect --multiplayer --session live-relay</text>
      <rect x="548" y="-13" width="9" height="17" fill="#38bdf8" class="cursor-blink" />
    </g>

    <!-- Main Title & Subtitle (Cleanly elevated in foreground) -->
    <g transform="translate(32, 136)">
      <text x="0" y="0" class="title-text" filter="url(#slightGlow)">Terminal IDEs &amp; Collaborative Coding</text>
      <text x="0" y="32" class="subtitle-text">Curated ecosystem of Cloud Development Environments, Modal Terminal IDEs, and Pair Programming Relays</text>
    </g>

    <!-- Category Feature Pills -->
    <g transform="translate(32, 212)">
      <!-- Pill 1 -->
      <g>
        <rect x="0" y="0" width="135" height="30" rx="8" fill="#1e1e38" stroke="#6366f1" stroke-width="1.2" />
        <text x="14" y="19" fill="#a5b4fc" class="tag-text">💻 Neovim &amp; Helix</text>
      </g>
      <!-- Pill 2 -->
      <g transform="translate(147, 0)">
        <rect x="0" y="0" width="145" height="30" rx="8" fill="#0f2634" stroke="#0284c7" stroke-width="1.2" />
        <text x="14" y="19" fill="#7dd3fc" class="tag-text">⚡ Zellij &amp; Tmate</text>
      </g>
      <!-- Pill 3 -->
      <g transform="translate(304, 0)">
        <rect x="0" y="0" width="160" height="30" rx="8" fill="#192823" stroke="#059669" stroke-width="1.2" />
        <text x="14" y="19" fill="#6ee7b7" class="tag-text">☁️ Coder &amp; Daytona</text>
      </g>
      <!-- Pill 4 -->
      <g transform="translate(476, 0)">
        <rect x="0" y="0" width="155" height="30" rx="8" fill="#2d182e" stroke="#c026d3" stroke-width="1.2" />
        <text x="14" y="19" fill="#f0abfc" class="tag-text">👥 Zed &amp; Live Share</text>
      </g>
      <!-- Pill 5 -->
      <g transform="translate(643, 0)">
        <rect x="0" y="0" width="180" height="30" rx="8" fill="#241e17" stroke="#d97706" stroke-width="1.2" />
        <text x="14" y="19" fill="#fcd34d" class="tag-text">🌐 Cloud Dev Workspaces</text>
      </g>
    </g>
  </g>
</svg>
